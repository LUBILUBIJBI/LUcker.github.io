<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111522">
  <title>LUcker – Download</title>
  <!-- Release settings: update these values when publishing a new version. -->
  <script>
    const DOWNLOAD_LINK = "https://cdn.discordapp.com/attachments/1553728463095992322/1563248503675818185/LUcker-v3.exe?ex=6adcf01f&is=6adb9e9f&hm=7f9a6d0df84dea96bb7ee7a117fcd4d02111980871635d8f24fe584aadfe2772&";
    const VERSION_NAME = "LUcker V3";
  </script>
  <style>
    :root { color-scheme: dark; --bg:#111522; --card:#1b2131; --line:#303950; --text:#f3f5fb; --muted:#aab4c9; --accent:#ff9a3d; --accent-dark:#21170f; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at 50% 0,#35251c 0,transparent 55%),var(--bg); color:var(--text); font:16px/1.55 "Segoe UI",system-ui,sans-serif }
    main { width:min(100%,560px); padding:clamp(24px,6vw,40px); border:1px solid var(--line); border-radius:24px; background:rgba(27,33,49,.96); box-shadow:0 24px 80px #0007 }
    .brand { display:flex; align-items:center; gap:14px }
    .mark { display:grid; place-items:center; width:54px; height:54px; border-radius:17px; background:#33271f; color:var(--accent); font-size:28px; font-weight:800 }
    .brand-name { font-size:19px; font-weight:750; letter-spacing:.2px }
    .eyebrow { color:var(--accent); font-size:12px; font-weight:750; letter-spacing:1.5px; text-transform:uppercase }
    h1 { margin:28px 0 5px; font-size:clamp(29px,6vw,38px); letter-spacing:-.8px; line-height:1.15 }
    p { margin:0; color:var(--muted) }
    .download { display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:96px; margin-top:25px; padding:20px 22px; border:1px solid var(--accent); border-radius:16px; background:var(--accent); color:var(--accent-dark); text-decoration:none; transition:transform .15s,filter .15s,box-shadow .15s }
    .download:hover { transform:translateY(-2px); filter:brightness(1.06); box-shadow:0 10px 30px #ff9a3d35 }
    .download:focus-visible,.repo:focus-visible { outline:3px solid white; outline-offset:3px }
    .cta-title { display:block; font-size:clamp(23px,5vw,30px); line-height:1.2; font-weight:850; letter-spacing:.3px; overflow-wrap:anywhere }
    .cta-hint { display:block; margin-top:7px; font-size:13px; line-height:1.4; opacity:.78 }
    .arrow { flex:none; font-size:29px; font-weight:700 }
    .repo { display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:68px; margin-top:12px; padding:16px 20px; border:1px solid var(--line); border-radius:14px; color:var(--text); font-weight:700; text-decoration:none; transition:border-color .15s,background .15s }
    .repo:hover { border-color:var(--accent); background:#ffffff08 }
    footer { margin-top:30px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:12px }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">L</span><span><span class="brand-name">LUcker</span><br><span class="eyebrow">Auto Clicker</span></span></div>
    <h1>Your next click starts here.</h1>
    <p>A free, local auto clicker for Windows.</p>

    <a class="download" id="download" href="https://github.com/LUBILUBIJBI/LUcker/releases/latest/download/LUcker.zip" download>
      <span><span class="cta-title">Download it directly</span><span class="cta-hint">Get the latest LUcker release for Windows</span></span>
      <span class="arrow" aria-hidden="true">↓</span>
    </a>

    <a class="repo" href="https://github.com/LUBILUBIJBI/LUcker" target="_blank" rel="noopener noreferrer"><span>Go to GitHub</span><span aria-hidden="true">↗</span></a>
    <footer>Downloads are provided by the link configured by the project owner. LUcker runs locally on your Windows PC.</footer>
  </main>

  <script>
    const download = document.getElementById("download");
    download.href = DOWNLOAD_LINK;
    download.title = "Download LUcker " + VERSION_NAME;
  </script>
</body>
</html>
